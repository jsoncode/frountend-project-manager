[package]
name = "frontend-project-manager"
version = "0.1.0"
description = "Frontend Project Manager"
authors = ["Frontend Project Manager contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
parking_lot = "0.12"
kill_tree = "0.2"
encoding_rs = "0.8"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
# Embedded bat for syntax-highlighted file preview in the terminal.
# regex-fancy: pure-Rust regex (no oniguruma). git + vendored-libgit2: change markers.
bat = { version = "0.26", default-features = false, features = ["regex-fancy", "git", "vendored-libgit2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Globalization",
] }
base64 = "0.22"
