# Release: on every `v*` tag push (or manual workflow_dispatch), build the
# Tauri app on Windows and macOS and publish the installers to a GitHub Release.
#
# Outputs:
#   Windows: NSIS (.exe)
#   macOS:   .app + .dmg (tauri native, per arch) + .pkg (built from the .app
#            with macOS' pkgbuild, since tauri does not support pkg natively)
#
# Usage:
#   git tag v0.4.3
#   git push origin v0.4.3
#
# The release is created as a DRAFT — review it in the Releases page and click
# "Publish" once all platforms have uploaded their installers.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0). Leave empty to use tauri.conf.json.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            arch: arm64
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            arch: x64
            args: '--target x86_64-apple-darwin --bundles app,dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      # 重跑/重推同 tag（或手动 dispatch）时，先清掉已存在的“已发布”Release：
      # tauri-action 只认草稿，遇到已发布 Release 会走错分支导致部分产物丢失。
      # 当前这次运行刚创建的草稿保留（多 job 并发上传到同一个草稿）。
      # 用解析出的 tag 而不是 GITHUB_REF_NAME，保证 workflow_dispatch 也能命中。
      - name: Remove stale published release for this tag
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --json draft -q .draft 2>/dev/null | grep -q false; then
            gh release delete "$TAG" --yes
            echo "Deleted stale published release for $TAG"
          else
            echo "No stale published release for $TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version files
        shell: bash
        run: node scripts/sync-version.mjs "${{ steps.ver.outputs.version }}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: 'FPM ${{ steps.ver.outputs.tag }}'
          releaseBody: |
            ## Frontend Project Manager ${{ steps.ver.outputs.tag }}

            ### 下载
            - **Windows**：`.exe`（NSIS 安装包）
            - **macOS Apple Silicon**：`aarch64` `.dmg` + `.pkg`
            - **macOS Intel**：`x86_64` `.dmg` + `.pkg`

            > macOS 未签名时，首次打开可能需在「系统设置 → 隐私与安全性」中允许，或右键选择「打开」。
            > `.pkg` 会把 App 安装到 `/Applications`（双击安装，或终端执行 `sudo installer -pkg xxx.pkg -target /`）。

            ### 本版本包含
            - 多工作区项目管理
            - 内置终端 / 脚本一键执行
            - IDE 打开与 Git 分支工具

            完整说明见 [README](../blob/master/README.md)。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # tauri 不支持 .pkg 目标 —— 用 macOS 的 pkgbuild 把刚打好的 .app 包成
      # .pkg 安装包，并上传到同一个 Release（按架构区分文件名）。
      - name: Build .pkg installer (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          APP="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Frontend Project Manager.app"
          pkgbuild --component "$APP" --install-location /Applications \
            "Frontend Project Manager_${VERSION}_${{ matrix.arch }}.pkg"
          echo "PKG_FILE=Frontend Project Manager_${VERSION}_${{ matrix.arch }}.pkg" >> "$GITHUB_ENV"

      - name: Upload .pkg to release (macOS)
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG_FILE }}
          # softprops 默认 draft:false，更新已存在的草稿会把草稿提前发布，
          # 导致后续 job 的 tauri-action 找不到草稿（"NOT a draft"）。显式保持草稿，
          # 等所有平台上传完成后由人工发布。
          draft: true
